# (statement sign-off) or carry a placeholder token (ZENODO_DOI_TBD).
# project.description is the public abstract: every sentence in it is meant to be a literal reading of the four
# Lean statements in HeadlineSeqV4/Challenge.lean (quantifiers, constants, the level set N = p^(sK-1), the scope).
version: "v0.4"

project:
  name: "Low-discrepancy quasi-uniform digital sequences in every dimension (Halton-type failure and residue sequences)"
  description: >-
    Two results of the manuscript "Low-discrepancy quasi-uniform digital sequences in every
    dimension" (version 1): Corollary cor:halton of Theorem thm:nonqu, and Theorem thm:residue with
    Corollaries cor:korobov and cor:residueQU for one explicit sequence. Quasi-uniform means here: there
    is a real B such that h(P_[N]) <= B delta(P_[N]) for every N >= 2, where P_[N] is the set of the
    first N points, h is the Euclidean covering radius of [0,1]^s (a supremum over the cube of the minimum distance to
    the points) and delta is the minimum Euclidean distance over pairs of distinct indices.
    (1) For every prime p, every s >= 2 and all pairwise coprime polynomials b_0, ..., b_(s-1) over
    Z/pZ of degree >= 1, the Halton-type sequence in these bases (Goda-Hofer-Suzuki, Def. 2:
    coordinate c of the point with index n = sum_k n_k p^k reads the b_c-adic digits
    (V div b_c^Q) mod b_c of V = sum_k n_k z^k, each written as its deg(b_c) coefficients, the
    coefficient of z^(deg(b_c)-1) first) is not quasi-uniform, and for every eps > 0 there are m and
    two distinct indices v, w < p^m whose points have Euclidean distance less than eps (p^m)^(-1/s).
    For every prime p and every s such bases exist.
    (2) Let s >= 2, let p > 2^s be prime and rho = floor(p^(1/s)). Consider the residue sequence with
    the Faure places a_c = c, scale theta = 1 and the Korobov check vector
    v = (rho, rho^2, ..., rho^(s-1), -1): the digital sequence over Z/pZ with generator matrices
    C_c[n][i] = v_c^(-1) [t^n] (c + t)^i w_c(c + t)^(-(n+1)), w_c(z) = prod_(c' != c) (z - c'), and
    coordinates y_c = sum_n y_(c,n) p^(-n-1) with digits in {0, ..., p-1}. It is a (0,s)-sequence in
    base p; for every K >= 1, any two distinct indices u, u' < N = p^(sK-1) give points at toroidal
    Euclidean distance (sum_c (d_c - round(d_c))^2)^(1/2), d = difference of the points, at least
    (rho - 1) p^(-1/s) N^(-1/s); and it is quasi-uniform. Moreover rho >= 2 and rho^s < p, every v_c
    is nonzero, the places are distinct, and the power series w_c(c + t) over Z/pZ times its inverse
    is 1. (The entry states no discrepancy bound; that (0,s)-sequences have low discrepancy is
    classical and is not part of this entry.)

    Comparator configuration: comparatorHeadlineSeqV4.json (4 compared theorems, all proved, no
    sorry): GeoSeqV4.halton_not_quasiUniform, GeoSeqV4.halton_bases_exist,
    GeoSeqV4.residue_quasiUniform, GeoSeqV4.residue_data. The Challenge
    (HeadlineSeqV4/Challenge.lean, 195 lines) imports only Mathlib and defines everything it uses
    from scratch (digital sequences from infinite generator matrices over ZMod p, the
    (0,s)-sequence property, Euclidean and toroidal distances, covering radius, minimum distance,
    quasi-uniformity, the Halton-type points, the residue generator matrices). The Solution
    (HeadlineSeqV4/Solution.lean) imports a verbatim copy of these definitions
    (HeadlineSeqV4/Defs.lean, generated by scripts/gen_headline_seq_v4_defs.py) and the full
    formalization GeoSeq of the same Lake project, proves bridge lemmas (each definition equals the
    corresponding GeoSeq definition) and obtains the theorems from compared theorems of GeoSeq
    (configurations comparatorGeoSeqV9.json, comparatorGeoSeqV93.json).
  authors:
    - {name: "Leonhard Gruenschloss", orcid: "0009-0004-6476-2191"}
  responsible_maintainers:
    - {name: "Leonhard Gruenschloss", orcid: "0009-0004-6476-2191"}
  license: "MIT"

