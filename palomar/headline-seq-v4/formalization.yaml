fidelity:
  divergences: |-
    - The fix is stated for ONE explicit member of the family of def:residue: the Faure places
      a_c = c, theta = 1 and the Korobov check vector. The paper's thm:residue holds for every check
      vector, every frame of distinct places and every theta in F_p^*; those forms are in the full
      formalization (comparatorGeoSeqV9.json), not in the entry.
    - Implicit data made explicit: cor:korobov does not spell out that the Korobov vector is a check
      vector (v_c != 0 in F_p, def:residue requires v in (F_p^*)^s), that theta = 1 != 0, or that the
      Faure places are distinct (s < p). In Lean, 0^(-1) = 0 for v_c^(-1) and the inverse of a power
      series with zero constant term is a junk value; residue_data proves v_c != 0, the places are
      distinct, and w_c(c + t) times its inverse is 1, so the generator matrices are the paper's.
    - Level set: the separation clause is for N = p^(sK-1), K >= 1, only (sep(P_(sK-1)) >= (rho-1)p^(-1/s)
      written out as (rho-1) p^(-1/s) N^(-1/s) <= toroidal distance, for distinct indices). Bounds for
      all N enter only through quasi-uniformity, stated as boundedness (exists B), without the
      explicit constants of cor:residueQU.
    - Quasi-uniformity definition: h(P_[N]) <= B delta(P_[N]) for all N >= 2 with BOTH h and delta
      Euclidean (Dick-Goda-Suzuki, Goda-Hofer-Suzuki). The paper's sec:prelim measures delta with the
      toroidal norm, which is at most the Euclidean one; hence the entry's fail statement (not
      quasi-uniform with Euclidean delta) implies the paper's, and the paper's quasi-uniformity of the
      residue sequence implies the entry's. h is a genuine supremum (the function is bounded on the
      cube) and delta an infimum over pairs of distinct indices, nonempty for N >= 2; a repeated
      point gives delta = 0. The two statements together show that the definition is neither always
      true nor always false.
    - Scope of the fail: prime base p only (cor:halton is stated over prime fields; the
      generalization of thm:nonqu to F_q by the natural identification is not in the entry), and
      dimension s >= 2. The entry states the qualitative consequence (close pairs below eps (p^m)^(-1/s)
      for every eps > 0, and not quasi-uniform); the explicit index pairs V_1, V_2 and the bound
      delta(P_(m_Q)) p^(m_Q/s) < sqrt(s+3) p^(-Q(s-1)E/s) stay in the full formalization.
    - Halton-type sequence: GHS Def. 2 as described in the paper after def:radinv (digit map
      pi_c(a) = ([z^(e_c-1)]a, ..., [z^0]a), index n = sum n_k p^k -> V = sum n_k z^k). div and mod are
      Mathlib's polynomial division over the field Z/pZ (also for non-monic b_c); the coordinate is a
      finite sum (a_Q = 0 for Q > n). The hypotheses do not require b_c monic or irreducible, as in
      cor:halton.
    - The (0,s)-sequence property reads box membership off the digits (an elementary box with d_c
      digits in coordinate c is the set of points whose first d_c digits are prescribed), counting
      indices; this avoids expansions ending in p-1, p-1, ... and agrees with the paper's convention.
      Digits in Z/pZ are read through r -> r.val. That the sequence is digital holds by construction.
    - rho = floor(p^(1/s)) is Nat.floor of Real.rpow; p^(-1/s) and N^(-1/s) are Real.rpow; round is
      Mathlib's round (ties upward; immaterial for the distance). The residue generator matrix entry
      [(z-a_c)^n] z^i / w_c(z)^(n+1) is written as the coefficient of t^n in the power series
      (a_c + t)^i w_c(a_c + t)^(-(n+1)) (Polynomial.taylor), as in def:residue.
    - No discrepancy statement: the entry proves the (0,s)-property of the residue sequence, not a
      discrepancy bound (star discrepancy O((log N)^s / N) of (0,s)-sequences is classical; the paper cites
      Niederreiter for it).
    - halton_bases_exist (Euclid's construction) is not in the paper, which assumes the hypotheses;
      it only shows they are satisfiable for every p and s.

