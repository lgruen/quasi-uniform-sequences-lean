name = "z3net"
version = "0.1.0"
defaultTargets = ["Z3Net", "GeoSeq", "HeadlineSeqV4", "GeoSeqChallenge", "GeoSeqSolution", "GeoSeqS10Challenge", "GeoSeqS10Solution", "GeoSeqS11Challenge", "GeoSeqS11Solution", "GeoSeqS3Challenge", "GeoSeqS3Solution", "GeoSeqS4Challenge", "GeoSeqS4Solution", "GeoSeqK4Challenge", "GeoSeqK4Solution", "GeoSeqV0Challenge", "GeoSeqV0Solution", "GeoSeqV1Challenge", "GeoSeqV1Solution", "GeoSeqV2Challenge", "GeoSeqV2Solution", "GeoSeqV3Challenge", "GeoSeqV3Solution", "GeoSeqV4Challenge", "GeoSeqV4Solution", "GeoSeqV4s4Challenge", "GeoSeqV4s4Solution", "GeoSeqV4s5Challenge", "GeoSeqV4s5Solution", "GeoSeqV5Challenge", "GeoSeqV5Solution", "GeoSeqV6Challenge", "GeoSeqV6Solution", "GeoSeqV7Challenge", "GeoSeqV7Solution", "GeoSeqV9Challenge", "GeoSeqV9Solution", "GeoSeqV93Challenge", "GeoSeqV93Solution", "GeoSeqV94Challenge", "GeoSeqV94Solution", "GeoSeqV95Challenge", "GeoSeqV95Solution", "GeoSeqV96Challenge", "GeoSeqV96Solution", "GeoSeqV97Challenge", "GeoSeqV97Solution", "GeoSeqV98Challenge", "GeoSeqV98Solution", "GeoSeqV99Challenge", "GeoSeqV99Solution", "GeoSeqV99caChallenge", "GeoSeqV99caSolution", "GeoSeqV99ca5eChallenge", "GeoSeqV99ca5eSolution", "GeoSeqV99ca5fChallenge", "GeoSeqV99ca5fSolution", "GeoSeqV99ca5aChallenge", "GeoSeqV99ca5aSolution", "GeoSeqV99ca5bChallenge", "GeoSeqV99ca5bSolution", "GeoSeqV99ca5cChallenge", "GeoSeqV99ca5cSolution", "GeoSeqV99ca5dChallenge", "GeoSeqV99ca5dSolution", "GeoSeqV99covChallenge", "GeoSeqV99covSolution"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

# The part of the nets library (github.com/lgruen/separated-nets-lean) that GeoSeq imports.
[[lean_lib]]
name = "Z3Net"
globs = ["Z3Net.+"]

# The library of the sequences paper: definitions, statement files GeoSeq/Statements/*.lean (with `sorry`, by
# design: the Challenge side of Comparator) and proofs.
[[lean_lib]]
name = "GeoSeq"
globs = ["GeoSeq.+"]

# The Palomar entry (cor:halton; thm:residue with cor:korobov, cor:residueQU): HeadlineSeqV4/Challenge.lean
# (Mathlib-only), HeadlineSeqV4/Defs.lean (generated by scripts/gen_headline_seq_v4_defs.py),
# HeadlineSeqV4/Solution.lean; configuration comparatorHeadlineSeqV4.json.
[[lean_lib]]
name = "HeadlineSeqV4"
roots = ["HeadlineSeqV4.Challenge", "HeadlineSeqV4.Defs", "HeadlineSeqV4.Solution"]

# Challenge and Solution roots of the Comparator configurations comparatorGeoSeq*.json (one library each).
# comparatorGeoSeq.json
[[lean_lib]]
name = "GeoSeqChallenge"
roots = ["GeoSeqChallenge"]

# comparatorGeoSeq.json
[[lean_lib]]
name = "GeoSeqSolution"
